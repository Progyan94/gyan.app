<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sound Garden</title>
<style>
  body {
    background-color: #2e3a23; /* Dark green */
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    min-height: 100vh;
  }
  header { margin: 20px 0; text-align: center; }
  a { color: #a8d5ba; text-decoration: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(16, 30px);
    gap: 2px;
    margin-top: 20px;
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 8px;
  }
  .cell {
    width: 30px;
    height: 30px;
    background-color: #3f4a34;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    user-select: none;
  }
  .cell:hover { background-color: #4f5f42; }
  .cell.active-col { background-color: #556b46; box-shadow: 0 0 10px #a8d5ba; }
  .controls { margin-top: 20px; }
  button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #a8d5ba; border: none; border-radius: 4px; color: #1a2312; font-weight: bold;}
  button:hover { background: #88c5a2; }
  .type-selector { margin-top: 15px; display: flex; gap: 10px; }
  .type-btn { padding: 8px 15px; cursor: pointer; border: 2px solid transparent; background: #3f4a34; color: white; border-radius: 4px; font-size: 14px; user-select: none;}
  .type-btn:hover { background: #4f5f42; }
  .type-btn.selected { border-color: #a8d5ba; background: #2a3321; }
</style>
</head>
<body>
<header>
  <h1>The Sound Garden 🌸✨</h1>
  <a href="../index.html">&larr; Back to Home</a>
</header>
<div class="controls">
  <button id="playBtn">Start Garden</button>
</div>
<div class="type-selector">
  <div class="type-btn selected" data-type="flower">🌸 Flower (Marimba)</div>
  <div class="type-btn" data-type="firefly">✨ Firefly (Chime)</div>
  <div class="type-btn" data-type="empty">🧹 Clear</div>
</div>
<div class="grid" id="grid"></div>

<script>
  const COLS = 16;
  const ROWS = 12;
  const gridEl = document.getElementById('grid');
  const playBtn = document.getElementById('playBtn');
  const typeBtns = document.querySelectorAll('.type-btn');
  
  let isPlaying = false;
  let audioCtx;
  let currentStep = 0;
  let nextNoteTime = 0;
  const scheduleAheadTime = 0.1;
  const lookahead = 25.0; // ms
  const tempo = 120; // BPM
  
  let currentType = 'flower';
  let garden = Array(ROWS).fill().map(() => Array(COLS).fill(null));
  
  // Pentatonic scales
  const marimbaScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66].reverse();
  const chimeScale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00, 2349.32].reverse();
  
  // UI Setup
  for(let r = 0; r < ROWS; r++) {
    for(let c = 0; c < COLS; c++) {
      let cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('mousedown', (e) => setCell(r, c, cell));
      cell.addEventListener('mouseenter', (e) => { if(e.buttons === 1) setCell(r, c, cell) });
      gridEl.appendChild(cell);
    }
  }

  typeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      typeBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      currentType = btn.dataset.type;
    });
  });
  
  function setCell(r, c, el) {
    if(currentType === 'empty') {
      garden[r][c] = null;
      el.innerHTML = '';
    } else {
      garden[r][c] = currentType;
      el.innerHTML = currentType === 'flower' ? '🌸' : '✨';
    }
  }
  
  function initAudio() {
    if(!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  
  function playMarimba(freq, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.6, time + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(time);
    osc.stop(time + 0.6);
  }

  function playChime(freq, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.3, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 1.2);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(time);
    osc.stop(time + 1.3);
  }
  
  function nextNote() {
    const secondsPerBeat = 60.0 / tempo;
    nextNoteTime += 0.25 * secondsPerBeat;
    currentStep++;
    if(currentStep >= COLS) {
      currentStep = 0;
    }
  }
  
  function scheduleNote(stepNumber, time) {
    requestAnimationFrame(() => {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('active-col'));
      document.querySelectorAll(`.cell[data-c="${stepNumber}"]`).forEach(el => el.classList.add('active-col'));
    });
    
    for(let r = 0; r < ROWS; r++) {
      let type = garden[r][stepNumber];
      if(type === 'flower') {
        playMarimba(marimbaScale[r], time);
      } else if(type === 'firefly') {
        playChime(chimeScale[r], time);
      }
    }
  }
  
  function scheduler() {
    while(nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
      scheduleNote(currentStep, nextNoteTime);
      nextNote();
    }
    if(isPlaying) {
      setTimeout(scheduler, lookahead);
    }
  }
  
  playBtn.addEventListener('click', () => {
    initAudio();
    isPlaying = !isPlaying;
    if(isPlaying) {
      playBtn.innerText = 'Pause Garden';
      if(audioCtx.state === 'suspended') { audioCtx.resume(); }
      nextNoteTime = audioCtx.currentTime + 0.05;
      scheduler();
    } else {
      playBtn.innerText = 'Start Garden';
    }
  });
</script>
</body>
</html>
