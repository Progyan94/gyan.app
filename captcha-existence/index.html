<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CAPTCHA of Existence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" class="back-link">← Back</a>
    <div class="captcha-container">
        <div class="captcha-header">
            <div class="prompt">Select all squares with</div>
            <div class="subject" id="captcha-subject">regret</div>
            <div class="subtitle">If there are none, click skip</div>
        </div>
        <div class="captcha-grid" id="captcha-grid">
            <!-- 9 squares -->
        </div>
        <div class="captcha-footer">
            <button id="verify-btn">Verify</button>
        </div>
        <div id="result-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
