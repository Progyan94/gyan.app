<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember & Aqua: Co-op Escape</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Main</a>
    <div class="game-container">
        <h1>Ember & Aqua: Co-op Escape</h1>
        <p class="credit">Original concept "Fireboy & Watergirl" created by Oslo Albet</p>
        <div class="instructions">
            <strong>Ember (Red):</strong> WASD to move & jump <br>
            <strong>Aqua (Blue):</strong> Arrow Keys to move & jump <br>
            <em>Work together to press buttons (green) and open gates (green) to reach your matching colored doors!</em>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
