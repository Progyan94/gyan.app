<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Shredder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../index.html" class="back-link">Back to Home</a>
    <div class="container">
        <h1>Paper Shredder</h1>
        <p>Type your worries away and shred them!</p>
        <div class="paper-container">
            <textarea id="paper" placeholder="Type something here..."></textarea>
        </div>
        <button id="shred-btn">Shred It!</button>
        <div class="shredder">
            <div class="slot"></div>
        </div>
        <div class="shreds-container" id="shreds-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
