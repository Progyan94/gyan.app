name: Build Multi-Platform Apps (Android, Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK (CAPACITOR)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: |
          npm install

      - name: Build web assets
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyan-wacky-world-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. BUILD DESKTOP APPS (TAURI: WINDOWS, MACOS, LINUX)
  # -------------------------------------------------------------
  build-tauri:
    name: Build Desktop Apps (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'windows'
          - platform: 'macos-latest'
            target: 'macos'
          - platform: 'ubuntu-22.04'
            target: 'linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libxdo-dev

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v1.0.${{ github.run_number }}
          releaseName: 'Gyan Wacky World v1.0.${{ github.run_number }}'
          releaseBody: 'Automated multi-platform builds for Android, Windows, macOS, and Linux.'
          releaseDraft: false
          prerelease: false

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gyan-desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
