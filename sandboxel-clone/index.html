<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandboxel Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../index.html">Back to Home</a>
    <h1>Sandboxel Clone</h1>
    <div id="controls">
        <button class="element-btn active" data-element="Sand">Sand</button>
        <button class="element-btn" data-element="Water">Water</button>
        <button class="element-btn" data-element="Wood">Wood</button>
        <button class="element-btn" data-element="Fire">Fire</button>
        <button class="element-btn" data-element="Stone">Stone</button>
        <button class="element-btn" data-element="Eraser">Eraser</button>
        <button id="clear-btn">Clear Canvas</button>
    </div>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
